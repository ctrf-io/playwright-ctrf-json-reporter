name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint/format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

  test-build:
    name: Test + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (TypeScript 7)
        run: npm run build:check

      - name: Test
        run: npm test

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          summary-delta-report: true
          github-report: true
          insights-report: true
          flaky-rate-report: true
          previous-results-report: true
          upload-artifact: true
          artifact-name: ctrf-test-report-node-${{ matrix.node }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && hashFiles('ctrf/*.json') != ''

      - name: Build
        run: npm run build

  security:
    name: Security (deps audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit (prod)
        run: npm audit --omit=dev
        continue-on-error: true

  runtime-node20:
    name: Packed production runtime (Node 20.19)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build tooling Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - name: Install and build
        run: npm ci && npm run build
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Runtime Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
      - name: Install production package and smoke test
        run: |
          mkdir "$RUNNER_TEMP/runtime-smoke"
          cd "$RUNNER_TEMP/runtime-smoke"
          npm init -y
          npm install --omit=dev "$RUNNER_TEMP/"*.tgz @playwright/test@1.64.0
          node --input-type=module -e "await import('playwright-ctrf-json-reporter')"
          node -e "require('playwright-ctrf-json-reporter')"
