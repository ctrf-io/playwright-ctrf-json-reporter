name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint/format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

  test-build:
    name: Test + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (TypeScript 7)
        run: npm run build:check

      - name: Test
        run: npm test

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          summary-delta-report: true
          github-report: true
          insights-report: true
          flaky-rate-report: true
          previous-results-report: true
          upload-artifact: true
          artifact-name: ctrf-test-report-node-${{ matrix.node }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && hashFiles('ctrf/*.json') != ''

      - name: Build
        run: npm run build

  integration:
    name: Real Playwright integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Prepare conformance diagnostics
        run: |
          echo "CTRF_STANDARD_ARTIFACTS=$RUNNER_TEMP/conformance" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/conformance"

      - name: Install
        id: install
        run: npm ci

      - name: Run packed reporter through real Playwright
        run: npm run test:integration

      - name: Run unit conformance and checker controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:standard:conformance:unit -- --reporter=default --reporter=json --reporter=./tests/standard/conformance/reporters/vitest.mjs --outputFile="$CTRF_STANDARD_ARTIFACTS/unit.json"

      - name: Install Chromium and system dependencies
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Run installed-package conformance with real Playwright
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:standard:conformance:integration

      - name: Publish conformance test reports
        uses: ctrf-io/github-test-reporter@v1
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          report-path: '${{ runner.temp }}/conformance/reports/*.json'
          title: 'Reporter conformance (Node ${{ matrix.node }})'
          summary-report: true
          test-report: true
          pull-request: ${{ matrix.node == '24' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          overwrite-comment: true
          comment-tag: reporter-conformance
          collapse-large-reports: true
          upload-artifact: true
          artifact-name: ctrf-conformance-node-${{ matrix.node }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload integration reports and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-integration-node-${{ matrix.node }}
          path: .integration-artifacts/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload conformance results and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-node-${{ matrix.node }}
          path: ${{ runner.temp }}/conformance/
          include-hidden-files: true
          if-no-files-found: warn

  security:
    name: Security (deps audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit (prod)
        run: npm audit --omit=dev
        continue-on-error: true
